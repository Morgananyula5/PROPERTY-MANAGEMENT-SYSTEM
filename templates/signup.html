<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Property Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&family=Victor+Mono:wght@300;500&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1DA1F2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 350px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-family: 'Victor Mono', monospace;
            font-size: 28px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: 0.3s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Fixed select dropdown styles */
        select {
            background-color: #1DA1F2;
            color: white;
            cursor: pointer;
        }

        select option {
            background: white;
            color: black;
        }

        select:focus {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            background: #fff;
            color: #1DA1F2;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #ebebeb;
        }

        .copy-icon {
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
            opacity: 0.7;
        }

        .copy-icon:hover {
            opacity: 1;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Error message styling */
        .error-message {
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

    </style>
    <script>
        function copyText(id) {
            var copyText = document.getElementById(id);
            navigator.clipboard.writeText(copyText.value);
            alert("Copied: " + copyText.value);
        }
    </script>
</head>
<body>

<div class="container">
    <h1>Create an Account</h1>

    <!-- Display error messages if any -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                {% if category == 'error' %}
                    <div class="error-message">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/signup" method="post">
        <input type="text" name="username" id="username" placeholder="Username" required>
        <span class="copy-icon" onclick="copyText('username')">📋</span>
        
        <input type="email" name="email" id="email" placeholder="Email" required>
        <span class="copy-icon" onclick="copyText('email')">📋</span>

        <input type="password" name="password" placeholder="Password" required>
        
        <select name="role" required>
            <option value="" disabled selected>Select Role</option>
            <option value="Resident">Resident</option>
            <option value="Manager">Property Manager</option>
        </select>

        <button class="btn" type="submit">Sign Up</button>
    </form>
    <p class="footer">Already have an account? <a href="/login">Login</a></p>
</div>

</body>
</html>
